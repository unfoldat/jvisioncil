backend:
  name: github
  repo: unfoldat/jvisioncil
  # 2026-08-26 (test/home-notice-4 전용, 임시) — CMS 저장이 이 브랜치로 격리되는지
  # 실증하기 위해 main → test/home-notice-4로 임시 변경. merge 직전 반드시 main으로
  # 되돌릴 것 — 이 값이 실수로 main에 들어가면 실제 CMS가 이 브랜치로 커밋을 시도해
  # 서비스가 깨진다.
  branch: test/home-notice-4
  # sveltia-cms-auth Cloudflare Worker (PAT 대신 OAuth).
  base_url: https://jvisioncil-cms-auth.dkdlvkt244.workers.dev

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: notices
    label: 소식
    description: 소식 게시판에 보일 글입니다.
    folder: src/content/notices
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: date, label: 날짜, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { name: pinned, label: '상단 고정 ([공지])', widget: boolean, default: false }
      - { name: showOnHome, label: 홈 화면에 보이기, widget: boolean, default: false, hint: '체크된 글 중 최신순으로 최대 3개까지 홈페이지에 미리보기 카드로 표시됩니다. 상단 고정과는 별개입니다.' }
      - { name: thumbnail, label: 카드 썸네일 사진(선택), widget: image, required: false, hint: '소식 목록 카드에 표시됩니다. 비워두면 로고가 대신 표시됩니다. 본문에 넣는 사진과는 별개입니다.' }
      - { name: thumbnailAlt, label: 썸네일 사진 설명(대체텍스트, 선택), widget: string, required: false, hint: '포스터·행사 현장처럼 사진 자체에 정보가 있으면 채워주세요(예: "6월 20일 임상음악치료 콘서트 포스터"). 제목과 겹치는 단순 장식 사진이면 비워두세요.' }
      - { name: summary, label: 목록 요약(한 줄), widget: string, required: false, hint: '소식 목록 카드에 제목 아래 짧게 표시됩니다. 예: "계절별로 떠나는 트레킹 프로그램의 세 번째 일정 참가자를 모집합니다." 비워두면 카드에 요약 없이 표시됩니다.' }
      - name: body
        label: 내용
        widget: markdown
        hint: '이미지·링크는 마크다운 문법으로 넣으면 됩니다. 넣은 사진은 전부 본문에 그대로 보입니다.'

  - name: gallery
    label: 메인갤러리
    description: 홈 "활동 사진", 소식 상단, 후원 하단의 흐르는 사진 갤러리에 표시됩니다. 소식 게시글 사진과는 별개입니다 — 여기 등록해야만 갤러리에 노출됩니다.
    label_singular: 갤러리 사진
    folder: src/content/gallery
    create: true
    reorder: true
    identifier_field: alt
    summary: '{{alt}}'
    fields:
      # 2026-08-18 필드 단위 media_folder 오버라이드 제거 — 소식(notices) 사진 필드와
      # 같은 미디어 라이브러리(전역 기본값 public/uploads)를 보게 함. 기존 11장도
      # public/images/gallery → public/uploads로 실제 이동, photo: 값도 갱신 완료 —
      # 이제 CMS 미리보기·재선택 둘 다 정상 작동한다.
      - { name: photo, label: 사진, widget: image }
      - { name: alt, label: 사진 설명(대체텍스트), widget: string, required: false, hint: '되도록 채워주세요.' }
      - name: showOn
        label: 노출 위치
        widget: select
        multiple: true
        options:
          - { label: '메인 (활동 사진)', value: home }
          - { label: '소식 (상단 흐르는 사진)', value: news }
          - { label: '후원 (후원으로 이어진 활동)', value: donate }
        default: [home, news, donate]
        hint: '이 사진을 노출할 위치를 고르세요. 기본값은 세 곳 모두입니다.'

  - name: donation-reports
    label: 기부금 공시
    description: 기부금 공시 게시판(/기부금-공시/)에 표시됩니다.
    label_singular: 기부금 공시 작성
    folder: src/content/donation-reports
    create: true
    identifier_field: title
    summary: '{{year}}년 · {{title}}'
    slug: '{{year}}'
    fields:
      - { name: year, label: 연도, widget: number, value_type: string, hint: '연도 4자리만 입력하세요. 예: 2026' }
      - { name: title, label: 제목, widget: string }
      - { name: file, label: 첨부파일(PDF), widget: file, accept: 'application/pdf,.pdf' }
      - { name: body, label: 본문내용(선택), widget: markdown, required: false, hint: '연도별 상세 설명이 있으면 적으세요. 비워두면 목록·다운로드만 표시됩니다.' }

  - name: instructors
    label: 강사 프로필
    description: 강의 안내 페이지의 강사 프로필 카드에 표시됩니다. 강사를 추가하거나 삭제하면 카드 개수가 그만큼 늘고 줍니다.
    label_singular: 강사 프로필 작성
    folder: src/content/instructors
    create: true
    identifier_field: name
    fields:
      - { name: name, label: 이름, widget: string }
      - { name: role, label: 전문 분야/직함, widget: string, hint: '예: "장애인식개선 교육 강사"' }
      - { name: photo, label: 사진, widget: image, hint: '카드에서 세로 3:4 비율로 잘려서 표시됩니다(가운데 기준). 얼굴이 잘리지 않으려면 세로형(3:4 비율 권장) 사진을 올려주세요. 예: 최소 450×600px 이상. 잘리는 위치가 마음에 안 들면 아래 "사진 위치 조정"으로 조정할 수 있습니다.' }
      - { name: photoAlt, label: 사진 설명(대체텍스트), widget: string, required: false, hint: '비워두면 장식용으로 처리됩니다 — 되도록 채워주세요.' }
      - { name: bio, label: 약력 소개, widget: list, field: { name: item, label: 약력 항목, widget: string } }
      - { name: photoPos, label: 사진 위치 조정(고급, 선택), widget: string, required: false, hint: '얼굴이 잘리면 조정하세요. 예: "center 20%". 비워두면 기본값 사용.' }

  - name: lectures
    label: 강의 종류
    description: 강의 안내 페이지의 "강의 종류" 카드에 표시됩니다. 항목을 추가하거나 삭제하면 카드 개수가 그만큼 늘고 줍니다.
    label_singular: 강의 종류 작성
    folder: src/content/lectures
    create: true
    reorder: true
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: target, label: 대상, widget: string, hint: '예: 사업주 및 근로자' }
      - { name: title, label: 강의명, widget: string }
      - { name: desc, label: 주요내용·강점, widget: text }
      - { name: meta, label: 교육시간, widget: string, hint: '예: 1시간, 40~60분, 1차시' }
      - { name: mandatory, label: 법정의무교육 여부, widget: boolean, default: false }

  - name: extra-courses
    label: 기타 전문교육
    description: 강의 안내 페이지의 "기타 전문교육" 카드에 표시됩니다. 카드 번호(01, 02...)는 순서에 따라 자동으로 매겨집니다.
    label_singular: 기타 전문교육 작성
    folder: src/content/extra-courses
    create: true
    reorder: true
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: desc, label: 설명, widget: text }

  - name: qa
    label: Q&A
    description: 홈 "처음 오셨나요?" 배너에서 연결되는 Q&A 게시판(/qa/)에 표시됩니다. 같은 분류(section) 안에서는 순서(order)가 작은 것부터 보여줍니다.
    label_singular: Q&A 항목 작성
    folder: src/content/qa
    create: true
    identifier_field: question
    summary: '{{section}} · {{question}}'
    fields:
      - name: section
        label: 분류
        widget: select
        options:
          - { label: 시각장애의 이해, value: understanding-blindness }
          - { label: 시각장애인 삶의 이해, value: daily-life }
          - { label: 시각장애인에 대한 에티켓, value: etiquette }
          - { label: 시각장애 수용의 이해, value: acceptance }
          - { label: 자립 및 자립생활의 이해, value: independent-living }
          - { label: 상담의 이해, value: counseling }
          - { label: 오디오도서의 이해, value: audiobook }
          - { label: 1365 자원봉사의 이해, value: volunteer1365 }
      - { name: question, label: 질문(Q), widget: string }
      - { name: order, label: 분류 안 순서, widget: number, value_type: int, hint: '같은 분류 안에서 작은 숫자가 먼저 보입니다.' }
      - { name: body, label: 답변(A), widget: markdown, hint: '표·목록·굵게 등 마크다운 서식을 그대로 지원합니다.' }

  - name: network-orgs
    label: 함께하는 기관
    description: 홈 하단과 센터소개 페이지의 함께하는 기관 배너에 표시됩니다.
    folder: src/content/network-orgs
    create: true
    fields:
      - { name: name, label: 기관명, widget: string }
      - { name: url, label: 기관 홈페이지, widget: string, required: false }

  - name: sponsors
    label: 후원기관
    description: 후원 안내 페이지의 후원기관 영역에 표시됩니다.
    folder: src/content/sponsors
    create: true
    fields:
      - { name: name, label: 기관명, widget: string }
      - { name: url, label: 기관 홈페이지, widget: string, required: false }

  - name: leadership
    label: 센터장·부센터장
    description: 센터소개 페이지의 센터장·부센터장 프로필에 표시됩니다.
    files:
      - name: director
        label: 센터장
        file: src/content/leadership/director.md
        fields:
          - { name: role, label: 직위, widget: string, default: 센터장 }
          - { name: name, label: 이름, widget: string }
          - { name: photo, label: 사진, widget: image }
          - { name: photoAlt, label: 사진 설명(대체텍스트), widget: string, required: false, hint: '예: "정금종 센터장 얼굴 사진". 비워두면 장식용으로 처리됩니다 — 되도록 채워주세요.' }
          - { name: bio, label: 주요 약력, widget: list, field: { name: item, label: 약력 항목, widget: string } }
          - { name: photoPos, label: 사진 위치 조정(고급, 선택), widget: string, required: false, hint: '얼굴이 잘리면 조정하세요. 예: "center 20%". 비워두면 기본값 사용.' }
      - name: deputy-director
        label: 부센터장
        file: src/content/leadership/deputy-director.md
        fields:
          - { name: role, label: 직위, widget: string, default: 부센터장 }
          - { name: name, label: 이름, widget: string }
          - { name: photo, label: 사진, widget: image }
          - { name: photoAlt, label: 사진 설명(대체텍스트), widget: string, required: false, hint: '예: "김기현 부센터장 얼굴 사진". 비워두면 장식용으로 처리됩니다 — 되도록 채워주세요.' }
          - { name: bio, label: 주요 약력, widget: list, field: { name: item, label: 약력 항목, widget: string } }
          - { name: photoPos, label: 사진 위치 조정(고급, 선택), widget: string, required: false, hint: '얼굴이 잘리면 조정하세요. 예: "center 15%". 비워두면 기본값 사용.' }

  - name: org-info
    label: 기관정보
    description: 주소·대표전화는 사이트 전체(푸터), 후원 계좌는 후원 안내 페이지에 표시됩니다.
    files:
      - name: info
        label: 기관정보
        file: src/content/org-info/info.md
        fields:
          - { name: address, label: 주소, widget: string }
          - { name: phone, label: 대표전화, widget: string, hint: '예: "02-732-0105". 전화 걸기 링크(tel:)는 이 번호에서 자동으로 만들어집니다.' }
          - { name: orgEmail, label: 기관 이메일, widget: string, required: false, hint: '푸터에 "이메일: (값)"으로 평문 표시됩니다(클릭 가능한 메일 링크 아님). 비워두면 그 줄 자체가 안 보입니다.' }
          - { name: bankName, label: 후원 계좌 — 은행명, widget: string }
          - { name: accountNumber, label: 후원 계좌 — 계좌번호, widget: string }
          - { name: accountHolder, label: 후원 계좌 — 예금주, widget: string }
